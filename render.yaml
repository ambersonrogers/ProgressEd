# Render Blueprint para ProgressEd (100% Gratuito)
# Provisiona Backend Express + Banco PostgreSQL Gerenciado na Nuvem

databases:
  - name: progress-ed-db
    databaseName: progressed
    user: progressed_user
    plan: free
    region: oregon

services:
  - type: web
    name: progress-ed-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: progress-ed-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://progress-ed.vercel.app
